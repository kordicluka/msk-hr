<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova poruka - MSK</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
        Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      background-color: #e4e4e4;
    "
  >
    <div
      style="
        max-width: 900px;
        margin: 0 auto;
        background-color: #ffffff;
        overflow: hidden;
      "
    >
      <!-- Header Section -->
      <div
        style="
          background-color: #1e293b;
          padding: 40px 30px;
          text-align: center;
          position: relative;
          overflow: hidden;
        "
      >
        <img
          src="https://msk-hr.s3.eu-north-1.amazonaws.com/1752432814920-icon_light.svg"
          alt="MSK Logo"
          style="
            width: 150px;
            height: 180px;
            margin: 0 auto 20px;
            display: block;
          "
        />
      </div>

      <!-- Content Section -->
      <div style="padding: 70px; padding-bottom: 130px">
        <div
          style="
            font-size: 40px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 20px;
            margin-top: 10px;
          "
        >
          Pozdrav!
        </div>

        <p
          style="
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 60px;
            line-height: 1.6;
          "
        >
          Primili ste novu poruku putem kontakt forme na web stranici. Evo
          detalja o poruci:
        </p>

        <!-- Contact Details Card -->
        <div style="background-color: #fdfeff; margin-top: 20px">
          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid #f1f5f9;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Ime:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{FIRST_NAME}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid #f1f5f9;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Prezime:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{LAST_NAME}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid #f1f5f9;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Email:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{EMAIL}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid #f1f5f9;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Telefon:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{PHONE}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 20px;
              padding-bottom: 20px;
              border-bottom: 1px solid #f1f5f9;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Usluga:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{SERVICE}}</span
            >
          </div>

          <div
            style="
              display: flex;
              align-items: flex-start;
              margin-bottom: 0;
              padding-bottom: 0;
              border-bottom: none;
            "
          >
            <span
              style="
                font-weight: 600;
                color: #475569;
                min-width: 130px;
                font-size: 15px;
                margin-right: 20px;
              "
              >Opis projekta:</span
            >
            <span
              style="
                color: #0f172a;
                font-size: 15px;
                flex: 1;
                word-break: break-word;
                font-weight: 500;
              "
              >{{PROJECT_DESCRIPTION}}</span
            >
          </div>
        </div>
      </div>

      <!-- Footer Section -->
      <div
        style="
          background-color: #f8fafc;
          padding: 30px;
          text-align: center;
          border-top: 1px solid #e5e7eb;
        "
      >
        <p style="color: #6b7280; font-size: 12px; line-height: 1.5; margin: 0">
          Ova poruka je automatski generirana iz kontakt forme na
          <a href="https://msk.hr" style="color: #1e293b; text-decoration: none"
            >msk.hr</a
          ><br />
        </p>
      </div>
    </div>
  </body>
</html>
